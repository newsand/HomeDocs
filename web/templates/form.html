<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pessoa</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="mast">
<a class="mast-mark" href="/people">ID-Center</a>
<a href="/people">lista</a>
</header>
<main class="case">
{% if error %}
<p class="notice">{{ error }}</p>
{% endif %}
<form method="post" action="{{ action }}" enctype="multipart/form-data">
{% for group in groups %}
<section class="group">
<h2>{{ group.Title }}</h2>
<div class="fields">
{% for field in group.Fields %}
<label>{{ field.Label }} <input name="{{ field.Name }}" value="{{ field.Value }}"></label>
{% endfor %}
</div>
</section>
{% endfor %}
<section class="group">
<h2>Arquivos</h2>
<div class="fields">
<label>Foto de rosto <input type="file" name="profile_photo" accept="image/*"></label>
<label>Scans dos documentos <input type="file" name="document_scans" accept="image/*,.pdf" multiple></label>
</div>
</section>
<div class="actions">
<button type="submit">salvar</button>
</div>
</form>
</main>
</body>
</html>
